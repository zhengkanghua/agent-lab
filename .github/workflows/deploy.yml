# 推 main 即构建、部署。手动入口 workflow_dispatch 用于「服务器侧改了配置，想重跑一次部署」而不必造一个空提交。
#
# **本工作流只负责部署，不跑测试。** 测试与回归在本地完成（命令见各运行时 README 与 AGENTS.md）；
# 把测试搬进 CI 会让「本地能过、CI 挂了」多出一条排查路径，而部署本身只需要「构建产物 + 推镜像 + 换服务」。
# 唯一保留的构建期检查是前端 `npm run build` 内含的 `vue-tsc -b`——它是构建的一部分，不是额外门禁。
#
# 单 job 顺序执行，不拆并行：后端必须先部署完再传前端 dist（顺序理由见 deploy 那一步的注释），
# 拆开之后要额外做 job 间的产物传递和顺序编排，对单人项目不划算。
#
# **后端是一个 Swarm 栈**（api/beat/worker 三个服务，定义见 backend/docker-stack.yml）：
# 部署用「先起后停」——迁移与起新任务都发生在旧任务还在服务的时候，旧任务只在新任务启动判定成功
# 之后才被停掉，所以部署期间新请求不中断；顺带拿到 `docker service update --rollback` 的秒级版本
# 回滚。取舍与后果见 docs/adr/0039 与 0040，服务器侧一次性准备与运维命令见 docs/container_deployment.md。
#
# 整体设计与取舍见 docs/adr/0008-backend-in-image-frontend-as-static-files.md。

name: 部署到甲骨文

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送取消仍在跑的旧运行，避免两次部署并发改同一台服务器和同一个数据库。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 镜像地址来自 GitHub Variables（仓库 Settings → Secrets and variables → Actions →
  # Variables 页签），不写在仓库里——本仓库是公开的，registry 实例 id 和命名空间不必公开。
  #
  # 用 Variables 而不是 Secrets：Secrets 的值在运行日志里会被替换成 ***，第一次调 CI 时
  # 看到的是 `docker push ***/***:backend-latest`，出错几乎无法定位。Variables 不加密、
  # 日志照常显示，而这些值本来也不是凭据（凭据是 ACR_USERNAME / ACR_PASSWORD）。
  #
  # ⚠ 下面拼出来的镜像地址必须和服务器 /opt/agent-lab/.env 里的 BACKEND_IMAGE 完全一致。
  # 两个值现在分别藏在 GitHub Variables 和服务器文件里，仓库里看不到、也没法自动比对；
  # 不一致的表现是「本工作流全绿、服务也换了，但跑的还是上一版代码」。
  # 改 registry 时两处必须同步改，清单见 docs/container_deployment.md 的「更换 registry」。
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
  BACKEND_IMAGE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/${{ vars.ACR_REPOSITORY }}:backend-latest

jobs:
  deploy:
    # ⚠ 必须是 ARM runner。甲骨文那台是 Ampere A1（`uname -m` 输出 aarch64），
    # 镜像架构和它不符时，容器会起不来并无限重启，日志里只有一行
    # `exec /app/.venv/bin/uvicorn: exec format error`——这是内核认出 ELF 但看不懂
    # 里面的机器码（ENOEXEC）。这个错很容易误判：它看起来像文件坏了或路径不对，
    # 但 shebang 坏掉、解释器缺失报的是 "no such file or directory"，不是这个。
    #
    # 用 ARM runner 原生构建，而不是在 x64 上开 QEMU 跑 linux/arm64：
    # QEMU 下装依赖并预编译字节码（Dockerfile 里 UV_COMPILE_BYTECODE=1）要慢十几分钟。
    # ARM 托管 runner 对公开仓库免费，本仓库是公开的。
    #
    # 前端在 ARM 上构建也没问题：package-lock.json 里有
    # @rolldown/binding-linux-arm64-gnu 和 lightningcss-linux-arm64-gnu，
    # 缺了这些 npm ci 会直接失败，所以换 Vite/Tailwind 大版本后要复查一次。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - name: 取代码
        uses: actions/checkout@v7

      # 未配置的 Variables 会静默变成空字符串，镜像名就成了 "/agent-lab:backend-latest"，
      # 报错发生在几分钟后的 push 步骤且信息含糊。这一步把它变成第一秒就失败、且说清缺哪个。
      # 只检查 Variables 与部署路径；ACR/SSH 凭据留给各自的步骤报错，避免在日志里提凭据名。
      - name: 检查必需的 Variables 已配置
        run: |
          missing=""
          for pair in \
            "ACR_REGISTRY=${{ vars.ACR_REGISTRY }}" \
            "ACR_NAMESPACE=${{ vars.ACR_NAMESPACE }}" \
            "ACR_REPOSITORY=${{ vars.ACR_REPOSITORY }}" \
            "DEPLOY_DIR=${{ vars.DEPLOY_DIR }}" \
            "WEB_ROOT=${{ vars.WEB_ROOT }}"; do
            name="${pair%%=*}"
            value="${pair#*=}"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "以下 Variables 未配置：$missing"
            echo "配置位置：仓库 Settings → Secrets and variables → Actions → Variables 页签"
            echo "应填什么见 docs/container_deployment.md 的「配置 GitHub Secrets 与 Variables」"
            exit 1
          fi
          echo "镜像地址：${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/${{ vars.ACR_REPOSITORY }}:backend-latest"

      # ---------- 2. 前端构建 ----------
      - name: 装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装前端依赖
        working-directory: frontend
        run: npm ci

      # build 已包含 vue-tsc -b，类型检查失败时同样在发布前停止。
      # 不传任何 VITE_* 变量：VITE_API_BASE_URL 默认就是 /api（frontend/src/api/client.ts），
      # 而 VITE_* 会被编译进公开产物，不能放密钥。
      - name: 构建前端
        working-directory: frontend
        run: npm run build

      # ---------- 3. 构建并推送后端镜像 ----------
      - name: 登录 ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v7
        with:
          # 构建上下文是 backend/，不是仓库根：Dockerfile 里的 COPY 路径都相对它。
          context: backend
          push: true

          # 写死目标架构，不靠 runner 默认值。这一行是护栏：万一有人把上面的
          # runs-on 换回 x64，构建会因为要在 x64 上跑 arm64 而立刻报错（没装 QEMU），
          # 而不是安安静静推一个服务器跑不了的 amd64 镜像上去——后者的表现是
          # 部署全绿、容器无限重启，只有 docker logs 里那行 exec format error。
          platforms: linux/arm64
          # 这个值必须和服务器 .env 里的 BACKEND_IMAGE 完全一致，
          # 否则会出现「CI 推 A、服务器拉 B」——表现是部署全绿但代码没更新。
          tags: ${{ env.BACKEND_IMAGE }}

          # 这两个必须关掉，不是优化而是能不能推上去的问题。
          # buildx 从 v0.10 起默认给镜像附加 provenance / SBOM 证明，它们在 manifest 里用
          # application/vnd.oci.empty.v1+json 这个媒体类型占位。阿里云 ACR 个人版不认识它，
          # 会在最后一步拒收：`denied: unknown manifest class for
          # application/vnd.oci.empty.v1+json`。
          # 坑在于失败发生得很晚——所有层都已经推完，只有 manifest 被拒，日志里前面全是
          # 正常的 writing layer，容易误以为是网络或权限问题。
          provenance: false
          sbom: false

          # 缓存用 GitHub Actions 自带的，不用 registry：registry 缓存写的是
          # application/vnd.buildkit.cacheconfig.v0 媒体类型，ACR 个人版同样可能不认
          # （它已经拒了上面那个 OCI 类型）。type=gha 不依赖 registry 支持，
          # 免费、每仓库 10GB 按 LRU 淘汰，对这个镜像够用。
          # 作用是依赖没变时不用重装 langchain 全家桶，能省几分钟。
          # url 和 token 由 build-push-action 自动注入，不用自己传。
          cache-from: type=gha
          # ignore-error=true 是有意的：缓存只是省时间，不该有权让部署失败。
          # 默认值 false 会让缓存导出出错时整个构建失败，而它有两种现实的出错方式——
          # Actions 缓存 API 被限流时导出会卡到 `maximum timeout reached`，
          # 以及缓存服务 v1/v2 切换（buildkit 按 ACTIONS_CACHE_SERVICE_V2 决定用哪版）。
          # 这两种情况下镜像本身是好的，没有理由不部署。
          cache-to: type=gha,mode=max,ignore-error=true

      # 候选栈文件要写进项目目录，所以部署账号得能写它。目录不可写时用一个已有镜像
      # 启动一个无网络的临时容器，只把项目目录本身的属主改回部署账号；不递归触碰
      # .env、数据或其他项目。
      #
      # 复用的镜像优先取正在跑的 agent-lab 容器那个（改造前后都在），退化到 .env 里
      # 那个镜像地址——不能再靠 `docker compose images`：改造之后普通容器形态已经不在了。
      - name: 准备编排目录写入权限
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"
            test -f .env
            if [ ! -w . ]; then
              deploy_path="$(pwd -P)"
              deploy_image="$(docker ps --filter name=agent-lab --format '{{.Image}}' | head -1)"
              if [ -z "$deploy_image" ]; then
                deploy_image="$(grep -E '^BACKEND_IMAGE=' .env | head -1 | cut -d= -f2- | tr -d '\r')"
              fi
              test -n "$deploy_image"
              docker run --rm --network none --read-only --user 0 --entrypoint python \
                --mount "type=bind,src=$deploy_path,dst=/deployment" "$deploy_image" \
                -c 'import os, sys; os.chown("/deployment", int(sys.argv[1]), int(sys.argv[2]))' \
                "$(id -u)" "$(id -g)"
            fi
            test -w .
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}

      # 候选栈文件以 next 名字上传，不覆盖服务器上已有的那份：改造期间那份普通容器编排
      # （docker-compose.yml）是退回旧部署方式的逃生路径，必须留着。反正部署命令用 -c
      # 显式指定文件，叫什么名字都不影响。
      - name: 上传候选栈文件
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -rlgoDz
          path: backend/docker-stack.yml
          remote_path: ${{ vars.DEPLOY_DIR }}/docker-stack.next.yml
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      # ---------- 4. 部署后端 ----------
      # 顺序，以及与旧流程的差别（理由见文件头与 docs/adr/0039）：
      #   校验候选栈文件 → 一次性容器（Redis 自检、用量库配置自检、业务库迁移、建表初始化）
      #   → 停掉还在用旧方式跑的容器（只在第一次切换时有事做）→ 起栈（先起后停在里面）
      #   → 等新任务就绪 → 清理旧镜像
      # 关键是**迁移与起新任务都在旧版本还在服务的时候完成**，旧任务只在新任务启动判定成功
      # 之后才被停掉。旧流程是「停旧 → 迁移 → 起新」，中间那段时间端口上没人服务。
      #
      # 在传前端之前做，是有意的：迁移失败就中止在这里，前端仍是旧版本，
      # 不会出现「新前端调老后端」。反过来先传前端则做不到这一点。
      - name: 部署后端
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # 密码通过 envs 传成远端的环境变量，不写进 script 的命令行——命令行会进
          # 服务器的进程列表和 shell history。
          envs: ACR_PASSWORD,ACR_REGISTRY,ACR_USERNAME,CI_BACKEND_IMAGE,DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"

            # 传了凭据就登录；手工跑同一段脚本时用机器上已有的 docker 登录即可（不传这两个变量就跳过）。
            # --password-stdin 而不是 -p：后者会让密码出现在进程列表里。
            if [ -n "${ACR_USERNAME:-}" ] && [ -n "${ACR_PASSWORD:-}" ]; then
              echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin
            else
              echo "未提供 ACR 凭据，沿用机器上已有的 docker 登录"
            fi

            # ⚠ **docker stack deploy 不读 .env**（只有 docker compose 读），栈文件里 ${} 引用的
            # 键必须来自进程环境，否则写成 ${VAR:?} 的键会直接报错。这里只导出会被插值的那几个，
            # 不整份 source .env：里面 LLM_USER_AGENT 这类值带空格与括号，会被 shell 拆坏。
            # 其余键由服务定义里的 env_file 注入容器，不经过环境。
            # 改 backend/docker-stack.yml 时新增了 ${} 引用，就要往这个列表里加一行。
            #
            # **这一段必须排在下面每一句引用 $BACKEND_IMAGE 的语句之前**：不排在前面的话，
            # `docker pull "$BACKEND_IMAGE"` 在远端环境里没有这个变量、set -u 直接退出
            # （演练里真的被这个坑到过：日志只有一行 `BACKEND_IMAGE: unbound variable`）。
            for key in BACKEND_IMAGE BACKEND_PORT TZ REDIS_URL WORKER_COUNT TASK_WORKER_CONCURRENCY; do
              # `|| true` 不是装饰：set -euo pipefail 下，grep 找不到键（.env 里本来就没有
              # TASK_WORKER_CONCURRENCY）会让整条管道返回 1，而「赋值给变量的命令返回值失败」
              # 同样会触发 set -e——脚本会在这里直接退出（演练时真的被这个坑到过）。
              value="$(grep -E "^${key}=" .env | head -1 | cut -d= -f2- | tr -d '\r' || true)"
              if [ -n "$value" ]; then export "$key=$value"; fi
            done

            # 镜像地址必须两处一致：CI 构建并推送的那一个（GitHub Variables 拼出来的）与服务器
            # .env 里的 BACKEND_IMAGE。不一致的表现是「部署全绿、服务也换了，但跑的还是旧镜像」
            # ——因为栈文件里的 ${BACKEND_IMAGE} 用的是服务器那一份。这里把它变成响的失败。
            # 两处怎么同步改见 docs/container_deployment.md 的「更换 registry」。
            if [ -n "${CI_BACKEND_IMAGE:-}" ] && [ "$CI_BACKEND_IMAGE" != "$BACKEND_IMAGE" ]; then
              echo "镜像地址不一致：CI 构建推送的是 $CI_BACKEND_IMAGE，而服务器 .env 里是 $BACKEND_IMAGE。"
              echo "两处必须完全一致，改法见文档的「更换 registry」一节。"
              exit 1
            fi

            # 先把新镜像拉到本地：起栈时 CLI 会去 registry 解析摘要并把它写进服务定义，
            # 节点再按摘要取镜像。这一步让「registry 里有这个镜像、凭据也对」在起栈之前就问清楚。
            docker pull "$BACKEND_IMAGE"

            # 候选文件先过栈加载器：语法错、未知字段、${VAR:?} 缺值都在这里报出来，比起栈之后
            # 再回滚便宜。注意它只做合并与插值，不是「swarm 会不会接受」的校验——那一条由
            # backend/tests/test_deploy_stack_file.py 的结构断言守。
            docker stack config -c docker-stack.next.yml >/dev/null

            # ---------- 一次性容器：都跑在项目网络上 ----------
            # 它们与服务看到同一个世界，尤其下面这条 Redis 自检验证的就是服务将来能不能够到
            # Redis（迁移本身只需要数据库、不碰队列，挂同一张网是为了口径一致）。
            # 这一整段都排在「停旧」之前：迁移必须在旧版本还服务的时候跑完。
            #
            # 连接凭据由客户端直接使用，错误只报告类型，不输出 URL、密码或配置。
            #
            # ⚠ **-i 不是可选项。** 程序是通过 <<'PY' heredoc 送进去的，而少了 -i 时 docker CLI
            # 不会把自己的 stdin 交给容器：容器里的 `python -` 读到空程序、立刻退出 0、什么都不
            # 打印——三条自检因此全部空跑，而脚本看不出任何异常（演练里真的被这个坑到过：
            # Redis 自检在地址写错时仍然"通过"，部署一路跑到起栈）。旧流程用的
            # `docker compose run` 默认就接 stdin，所以那时没这个问题。
            docker run --rm -i --network agent-lab-net --env-file .env --entrypoint python "$BACKEND_IMAGE" - <<'PY'
            import sys
            from redis import Redis
            from agent_lab.config.redis import get_redis_settings

            try:
                settings = get_redis_settings()
                with Redis.from_url(settings.url.get_secret_value(),
                                    password=settings.password.get_secret_value() or None,
                                    socket_connect_timeout=5, socket_timeout=5) as client:
                    client.ping()
            except Exception as error:
                print(f"Redis 连接检查失败（{type(error).__name__}）；请核对地址、密码和网络。", file=sys.stderr)
                raise SystemExit(1)
            print("Redis 连接检查通过")
            PY

            # 用量库配置自检。它必须放在停旧之前：用量库配置缺失或不合法时应用启动就会
            # 失败（配置缺失即启动失败，不是静默不记），把生产停在一半才发现 .env 少了一项
            # 是完全可以避开的。
            docker run --rm -i --network agent-lab-net --env-file .env --entrypoint python "$BACKEND_IMAGE" - <<'PY'
            import sys
            from pydantic import ValidationError
            from agent_lab.config.usage_database import get_usage_database_settings

            try:
                get_usage_database_settings()
            except ValidationError as error:
                print("用量库配置不合法，请核对 .env 里的 LLMOPS_*（键列表见 backend/.env.example）。", file=sys.stderr)
                print(f"缺失或不合法的键：{sorted('LLMOPS_' + str(item['loc'][0]).upper() for item in error.errors())}", file=sys.stderr)
                raise SystemExit(1)
            print("用量库配置自检通过")
            PY

            # 业务库迁移。
            docker run --rm --network agent-lab-net --env-file .env "$BACKEND_IMAGE" alembic upgrade head

            # 用量数据在独立库 llmops 里（ADR 0032），它有自己的迁移链。库不存在时先建库：
            # 连接串来自 LLMOPS_DATABASE_URL，而建库只能连同一个实例的维护库 postgres 执行。
            # 已存在就跳过，所以重复部署安全。
            docker run --rm -i --network agent-lab-net --env-file .env --entrypoint python "$BACKEND_IMAGE" - <<'PY'
            import sys
            import psycopg
            from sqlalchemy.engine import make_url
            from agent_lab.config.usage_database import get_usage_database_settings

            url = make_url(str(get_usage_database_settings().database_url))
            if url.get_backend_name() != "postgresql":
                print("用量库连接串必须是 PostgreSQL。", file=sys.stderr)
                raise SystemExit(1)

            def connect(dbname):
                return psycopg.connect(host=url.host, port=url.port, dbname=dbname, user=url.username,
                                       password=url.password, connect_timeout=5, autocommit=True)

            try:
                with connect(url.database):
                    print("用量库已存在，跳过创建")
            except psycopg.OperationalError:
                with connect("postgres") as conn, conn.cursor() as cursor:
                    cursor.execute(f'CREATE DATABASE "{url.database}"')
                print("用量库已创建")
            PY

            docker run --rm --network agent-lab-net --env-file .env "$BACKEND_IMAGE" alembic -c alembic_usage.ini upgrade head
            docker run --rm --network agent-lab-net --env-file .env "$BACKEND_IMAGE" agent-lab init-checkpointer

            # ---------- 停掉还在用旧方式（普通容器）跑的三个进程 ----------
            # 只在第一次切换时真的有事做：Swarm 要发布同一个宿主机端口，旧容器占着它就起不来。
            # 改造完成之后再执行到这里是空操作（服务器上那份 docker-compose.yml 留着当逃生路径，
            # 它已经不是日常部署用的那一份，见 backend/docker-compose.yml 头部）。
            if [ -f docker-compose.yml ] && [ -n "$(docker compose -f docker-compose.yml ps -q 2>/dev/null || true)" ]; then
              echo "停掉旧编排里的进程（一次性动作；之后这一步是空操作）"
              docker compose -f docker-compose.yml stop --timeout 180 backend || true
              docker compose -f docker-compose.yml stop --timeout 360 task-worker task-beat || true
              cp docker-compose.yml docker-compose.previous.yml
            fi

            # ---------- 起栈（先起后停在里面）----------
            # --with-registry-auth 不是可选项：它让 CLI 去 registry 解析摘要、把 digest 写进服务
            # 定义，于是「回滚到上一版」回到的是那一版**具体镜像**，而不是一个已经被覆盖的可变
            # 标签（实测：不带它时服务定义里只有 backend-latest）。它同时也在告诉节点用哪个凭据
            # 去拉私有镜像。
            # --detach=false：等更新器给出结论再往下走（这个版本的默认是不等）。它必须等：不等的话
            # 下面那段就绪判定可能读到**上一次**更新遗留下来的 completed，或者在新任务健康而更新还没
            # 走完时就判成就绪。
            # 后面那个过滤只是去噪声：非 TTY 下 CLI 会把「还在等收敛」重复打印几百遍，真出错时
            # 会把有用的行埋掉。退出码用 PIPESTATUS 单独取，不受过滤影响。
            set +e
            docker stack deploy --with-registry-auth --detach=false -c docker-stack.next.yml agent-lab 2>&1 \
              | grep -v '^verify: Waiting'
            deploy_status=${PIPESTATUS[0]}
            set -e
            if [ "$deploy_status" -ne 0 ]; then
              echo "起栈失败（退出码 $deploy_status）"
              exit 1
            fi

            echo "服务定义里的镜像引用（带 @sha256: 才算摘要被钉住，秒级回滚才有意义）："
            docker service inspect agent-lab_backend --format '  {{json .Spec.TaskTemplate.ContainerSpec.Image}}'

            # ---------- 等新任务就绪 ----------
            # 两条判据一起看：
            # 1. 更新器自己的结论（UpdateStatus）：只有它知道「新任务启动成功、旧任务已停」还是
            #    「自己回滚了」。只看到「任务在跑且健康」不够——回滚之后跑的正是旧任务，它当然
            #    健康，那种情况下必须报失败。
            # 2. 任务本身：运行中的任务数等于声明的副本数，且 API 容器健康（容器的健康状态只在
            #    节点的 docker ps 里看得见，服务定义里读不到）。
            deadline=$((SECONDS + 300))
            ready=""
            while [ "$SECONDS" -lt "$deadline" ]; do
              state="$(docker service inspect agent-lab_backend --format '{{json .UpdateStatus}}' 2>/dev/null | grep -o '"State":"[a-z_]*"' | cut -d'"' -f4 || true)"
              case "$state" in
                rollback_started|rollback_completed|paused)
                  echo "更新器判定新版本没有接班（UpdateStatus.State=$state），它已经自己回滚："
                  docker service ps agent-lab_backend --no-trunc | head -20
                  exit 1
                  ;;
              esac
              api_health="$(docker ps --filter name=agent-lab_backend --format '{{.Status}}' | head -1)"
              running="$(for service in agent-lab_backend agent-lab_task-beat agent-lab_task-worker; do
                # 服务可能还没被创建（第一次部署的第一个轮次），别让那种失败把脚本带走。
                docker service ps "$service" --filter desired-state=running --format '{{.Name}}' 2>/dev/null || true
              done | sort -u | wc -l)"
              case "$api_health" in
                *healthy*)
                  if [ "$running" -ge 3 ]; then ready="yes"; break; fi
                  ;;
              esac
              sleep 5
            done
            if [ -z "$ready" ]; then
              echo "等待新任务就绪超时（300 秒）："
              docker service ls
              docker service ps agent-lab_backend agent-lab_task-beat agent-lab_task-worker --no-trunc 2>/dev/null | head -30 || true
              exit 1
            fi
            echo "新任务已就绪：$api_health（运行中任务 $running 个）"

            # Beat 与 Worker 的就绪检查打到**任务容器**上。它们刻意没有声明健康检查：在 Swarm
            # 里健康检查不过等于 agent 把容器杀掉重启，而 Worker 手上的文档批次被杀会留下需要
            # 人工确认的待核实记录（理由写在 backend/docker-stack.yml 里）。所以这两条检查是
            # 它们唯一的就绪信号。
            for i in $(seq 1 10); do
              beat="$(docker ps --filter name=agent-lab_task-beat --format '{{.ID}}' | head -1)"
              worker="$(docker ps --filter name=agent-lab_task-worker --format '{{.ID}}' | head -1)"
              if [ -n "$beat" ] && [ -n "$worker" ] \
                 && docker exec "$beat" python -m agent_lab.tasks.status --check \
                 && docker exec "$worker" sh -c 'celery -A agent_lab.tasks.celery_app:app inspect ping --destination "worker@$HOSTNAME" --timeout 5'; then
                echo "Beat 推进与 Worker 消息连接检查通过"
                break
              fi
              if [ "$i" -eq 10 ]; then
                echo "任务进程就绪检查失败，请检查调度、消息连接及待核实执行"
                docker logs --tail 50 "$beat" 2>/dev/null || true
                docker logs --tail 50 "$worker" 2>/dev/null || true
                exit 1
              fi
              sleep 3
            done

            # 顺手清掉本栈**已退出**的任务容器：任务被替换后旧容器会被停掉但留在节点上（实测：
            # 每次部署多留三个，`docker ps -a` 里是 Exited，占着日志与元数据）。只删本栈的
            # （名字带 agent-lab_ 下划线前缀；旧的普通容器是横线，不会误伤），且只在就绪检查通过
            # 之后删——那时候旧任务都已经排空收尾完了。
            docker ps -a --filter name=agent-lab_ --filter status=exited --format '{{.Names}}' \
              | xargs -r docker rm >/dev/null || true

            # 被 backend-latest 覆盖掉的旧镜像会变成无名镜像留在磁盘上，不清理会慢慢吃满。但
            # **不能无条件清空**：秒级回滚要回到的那一版必须在本地，否则「一条命令切回上一版」
            # 会变成一个报错的按钮（见 ADR 0039）。所以只删 7 天前的无名镜像：够回滚用，又不让
            # 磁盘无限涨。改这一行会让 backend/tests/test_deploy_stack_file.py 变红。
            docker image prune -f --filter "until=168h"
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          # 名字与服务器 .env 里的 BACKEND_IMAGE 分开：同名的话远端脚本会先按 .env 的值把它覆盖掉，
          # 就没法再比对两处是否一致了（下面的比对正是为了挡住「部署全绿但跑的还是旧镜像」）。
          CI_BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}

      # ---------- 5. 上传前端 dist ----------
      # 用 rsync --delete 而不是 scp：Vite 产物文件名带哈希（app-abc123.js），
      # 每次构建都变，只拷不删会让目录里堆满历史废文件。
      # 尾部斜杠有意义：source 带斜杠表示「拷目录内容」而不是「拷目录本身」，
      # 去掉会变成 index/dist/ 这样嵌一层。
      - name: 上传前端 dist
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -rlgoDz --delete
          path: frontend/dist/
          # 尾部斜杠是必需的，见上面注释。WEB_ROOT 里不要带尾部斜杠，这里统一补一个，
          # 避免 Variables 里填了斜杠时变成两个（rsync 对 // 宽容，但目录名会显得可疑）。
          remote_path: ${{ vars.WEB_ROOT }}/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
