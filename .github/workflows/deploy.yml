# 推 main 即测试、构建、部署。手动入口 workflow_dispatch 用于「服务器侧改了配置，
# 想重跑一次部署」而不必造一个空提交。
#
# 单 job 顺序执行，不拆并行：后端必须先部署完再传前端 dist（顺序理由见 deploy 那一步的注释），
# 拆开之后要额外做 job 间的产物传递和顺序编排，对单人项目不划算。
#
# 整体设计与取舍见 docs/adr/0008-backend-in-image-frontend-as-static-files.md，
# 服务器侧一次性准备见 docs/container_deployment.md。

name: 部署到甲骨文

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送取消仍在跑的旧运行，避免两次部署并发改同一台服务器和同一个数据库。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  # 镜像地址来自 GitHub Variables（仓库 Settings → Secrets and variables → Actions →
  # Variables 页签），不写在仓库里——本仓库是公开的，registry 实例 id 和命名空间不必公开。
  #
  # 用 Variables 而不是 Secrets：Secrets 的值在运行日志里会被替换成 ***，第一次调 CI 时
  # 看到的是 `docker push ***/***:backend-latest`，出错几乎无法定位。Variables 不加密、
  # 日志照常显示，而这些值本来也不是凭据（凭据是 ACR_USERNAME / ACR_PASSWORD）。
  #
  # ⚠ 下面拼出来的镜像地址必须和服务器 /opt/agent-lab/.env 里的 BACKEND_IMAGE 完全一致。
  # 两个值现在分别藏在 GitHub Variables 和服务器文件里，仓库里看不到、也没法自动比对；
  # 不一致的表现是「本工作流全绿、容器也重启了，但跑的还是上一版代码」。
  # 改 registry 时两处必须同步改，清单见 docs/container_deployment.md 的「更换 registry」。
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
  BACKEND_IMAGE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/${{ vars.ACR_REPOSITORY }}:backend-latest

jobs:
  deploy:
    # ⚠ 必须是 ARM runner。甲骨文那台是 Ampere A1（`uname -m` 输出 aarch64），
    # 镜像架构和它不符时，容器会起不来并无限重启，日志里只有一行
    # `exec /app/.venv/bin/uvicorn: exec format error`——这是内核认出 ELF 但看不懂
    # 里面的机器码（ENOEXEC）。这个错很容易误判：它看起来像文件坏了或路径不对，
    # 但 shebang 坏掉、解释器缺失报的是 "no such file or directory"，不是这个。
    #
    # 用 ARM runner 原生构建，而不是在 x64 上开 QEMU 跑 linux/arm64：
    # QEMU 下装依赖并预编译字节码（Dockerfile 里 UV_COMPILE_BYTECODE=1）要慢十几分钟。
    # ARM 托管 runner 对公开仓库免费，本仓库是公开的。
    #
    # 前端在 ARM 上构建也没问题：package-lock.json 里有
    # @rolldown/binding-linux-arm64-gnu 和 lightningcss-linux-arm64-gnu，
    # 缺了这些 npm ci 会直接失败，所以换 Vite/Tailwind 大版本后要复查一次。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    # 仅供队列/迁移验收的临时数据库，随 runner 销毁，不连接应用数据库。
    services:
      task-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tasks_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasks_test -d tasks_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: 取代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 按上次成功部署选择测试范围
        id: tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from fnmatch import fnmatchcase

          # 不能只比较 event.before：它可能来自被取消或失败、尚未验证的推送。
          base, changed, deleted = "", [], []
          full = os.environ["GITHUB_EVENT_NAME"] != "push"
          if not full:
              try:
                  runs = json.loads(subprocess.check_output([
                      "gh", "run", "list", "--workflow", "deploy.yml",
                      "--branch", os.environ["GITHUB_REF_NAME"], "--status", "success",
                      "--limit", "1", "--json", "headSha",
                  ], stderr=subprocess.PIPE))
                  base = runs[0]["headSha"] if runs else ""
                  if not re.fullmatch(r"[0-9a-f]{40}", base):
                      raise ValueError("没有可比较的成功部署")
                  subprocess.run(["git", "merge-base", "--is-ancestor", base, "HEAD"],
                                 check=True, capture_output=True)
                  def paths(*options):
                      result = subprocess.check_output([
                          "git", "diff", "--name-only", "--no-renames", "-z",
                          *options, base, "HEAD",
                      ])
                      return [path for path in result.decode().split("\0") if path]
                  # 重命名按旧路径删除、新路径新增处理；测试资料也参与范围判断。
                  changed = [path for path in paths()
                             if not path.endswith(".md") or "/tests/" in path]
                  deleted = paths("--diff-filter=D")
              except (subprocess.SubprocessError, OSError, ValueError, KeyError, TypeError):
                  full = True

          def touches(*patterns):
              return any(fnmatchcase(path, pattern) for path in changed for pattern in patterns)

          full = full or touches(".github/workflows/*")
          backend = full or touches("backend/*")
          infrastructure = touches(
              "backend/pyproject.toml", "backend/uv.lock", "backend/.python-version",
              "backend/Dockerfile*", "backend/docker-compose*", "backend/.env*",
          )
          migration = full or infrastructure or touches(
              "backend/alembic*", "backend/src/agent_lab/models/*", "backend/src/agent_lab/db/*",
              "backend/tests/test_task_migration_postgres_integration.py",
              "backend/tests/test_scheduler_postgres_integration.py", "backend/tests/conftest.py",
          )
          queue_transport = full or infrastructure or touches(
              "backend/src/agent_lab/config/redis.py", "backend/src/agent_lab/config/task_queue.py",
              "backend/src/agent_lab/config/settings.py", "backend/src/agent_lab/task_assembly.py",
              "backend/src/agent_lab/tasks/celery_app.py", "backend/src/agent_lab/tasks/process.py",
              "backend/src/agent_lab/tasks/dispatch.py", "backend/src/agent_lab/tasks/beat.py",
              "backend/src/agent_lab/tasks/worker.py", "backend/tests/*task_queue*",
              "backend/tests/conftest.py",
          )
          queue = migration or queue_transport or touches(
              "backend/src/agent_lab/tasks/*", "backend/src/agent_lab/scheduler_maintenance.py",
              "backend/src/agent_lab/config/scheduler.py", "backend/src/agent_lab/runtime.py",
              "backend/src/agent_lab/main.py", "backend/src/agent_lab/domain/*",
              "backend/src/agent_lab/knowledge/*", "backend/src/agent_lab/repositories/*",
              "backend/src/agent_lab/services/scheduled_*", "backend/src/agent_lab/services/write_coordination.py",
              "backend/src/agent_lab/services/document_retention_service.py",
              "backend/src/agent_lab/services/execution_cleanup.py",
              "backend/src/agent_lab/api/task*", "backend/src/agent_lab/api/scheduled_jobs.py",
              "backend/src/agent_lab/schemas/tasks.py", "backend/src/agent_lab/schemas/scheduled_jobs.py",
              "backend/tests/*task_*", "backend/tests/*scheduler*", "backend/tests/*scheduled*",
              "backend/tests/app_helpers.py",
          )
          frontend_full = full or touches(
              "frontend/package*.json", "frontend/*config*", "frontend/.npmrc",
              "frontend/src/api/*", "frontend/src/main.ts", "frontend/src/App.vue",
              "frontend/src/app/router.ts",
              "backend/src/agent_lab/api/*", "backend/src/agent_lab/schemas/*",
          ) or any(path.startswith("frontend/") and (not path.endswith(".md") or "/tests/" in path)
                   for path in deleted)
          frontend = frontend_full or touches("frontend/*")
          outputs = dict(backend=backend, queue=queue, queue_transport=queue_transport,
                         migration=migration, frontend=frontend, frontend_full=frontend_full)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"base={base}\n")
              for name, enabled in outputs.items():
                  output.write(f"{name}={str(enabled).lower()}\n")
          print("验证基线：" + ("完整验证（手动执行、基线不可用或工作流变化）" if full else base))
          print("测试范围：" + json.dumps(outputs, ensure_ascii=False))
          PY

      # 未配置的 Variables 会静默变成空字符串，镜像名就成了 "/agent-lab:backend-latest"，
      # 报错发生在几分钟后的 push 步骤且信息含糊。这一步把它变成第一秒就失败、且说清缺哪个。
      # 只检查 Variables 与部署路径；ACR/SSH 凭据留给各自的步骤报错，避免在日志里提凭据名。
      - name: 检查必需的 Variables 已配置
        run: |
          missing=""
          for pair in \
            "ACR_REGISTRY=${{ vars.ACR_REGISTRY }}" \
            "ACR_NAMESPACE=${{ vars.ACR_NAMESPACE }}" \
            "ACR_REPOSITORY=${{ vars.ACR_REPOSITORY }}" \
            "DEPLOY_DIR=${{ vars.DEPLOY_DIR }}" \
            "WEB_ROOT=${{ vars.WEB_ROOT }}"; do
            name="${pair%%=*}"
            value="${pair#*=}"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "以下 Variables 未配置：$missing"
            echo "配置位置：仓库 Settings → Secrets and variables → Actions → Variables 页签"
            echo "应填什么见 docs/container_deployment.md 的「配置 GitHub Secrets 与 Variables」"
            exit 1
          fi
          echo "镜像地址：${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/${{ vars.ACR_REPOSITORY }}:backend-latest"

      # ---------- 1. 后端测试 ----------
      # 普通回归仍离线；随后单独运行真实 Linux 消息与临时 PostgreSQL 验收。
      # 这个 action 从 v8 起不再发布浮动大版本 tag（v8/v9/v10 都不存在，只有 v10.0.1
      # 这样的精确 tag），所以这里必须钉精确版本。写 @v10 会在 Set up job 阶段就失败：
      # 「Unable to resolve action, unable to find version v10」。
      # 升级时去 releases 页面取最新的精确 tag，不要照其他 action 的样子写大版本号。
      - name: 装 uv
        if: steps.tests.outputs.backend == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: 装后端依赖
        if: steps.tests.outputs.backend == 'true'
        working-directory: backend
        run: uv sync --frozen --all-groups

      # 真实 Docling 结构测试依赖锁定的 BGE-M3 tokenizer；缺失时会跳过。
      # 在测试前下载并核验资源，避免 CI 通过却没有执行结构与预算验证。
      - name: 准备文档 tokenizer 资源
        if: steps.tests.outputs.backend == 'true'
        working-directory: backend
        run: uv run --frozen python -m agent_lab.prepare_document_resources

      # 必须给 DATABASE_URL 一个占位值。测试本身不连数据库，但 Settings.database_url 没有
      # 默认值，而 runner 上没有 .env——缺了它 pytest 在**收集阶段**就 ValidationError，
      # 一个用例都跑不到。这个值必须是假的：填真实连接串等于把生产库暴露给 CI 日志。
      - name: 后端测试
        if: steps.tests.outputs.backend == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/ci
        run: uv run --frozen pytest

      - name: 公共任务 Linux 队列与迁移验收
        if: steps.tests.outputs.queue == 'true' || steps.tests.outputs.migration == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://tasks_test:isolated_test_only@127.0.0.1:5432/tasks_test
          TASK_TEST_DATABASE_URL: postgresql+psycopg://tasks_test:isolated_test_only@127.0.0.1:5432/tasks_test
          SCHEDULER_TEST_DATABASE_URL: postgresql+psycopg://tasks_test:isolated_test_only@127.0.0.1:5432/tasks_test
          RUN_TASK_QUEUE_INTEGRATION_TEST: "1"
          RUN_POSTGRES_SCHEDULER_INTEGRATION_TEST: "1"
          TEST_QUEUE: ${{ steps.tests.outputs.queue }}
          TEST_QUEUE_TRANSPORT: ${{ steps.tests.outputs.queue_transport }}
          TEST_MIGRATION: ${{ steps.tests.outputs.migration }}
        run: |
          tests=()
          selection=()
          if [ "$TEST_QUEUE" = true ]; then
            if ! command -v redis-server >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends redis-server
            fi
            tests+=(tests/test_task_queue_integration.py
                    tests/test_task_handoff_postgres_integration.py
                    tests/test_scheduler_postgres_integration.py)
          fi
          if [ "$TEST_MIGRATION" = true ]; then
            tests+=(tests/test_task_migration_postgres_integration.py)
          fi
          if [ "$TEST_QUEUE_TRANSPORT" != true ]; then
            selection+=(-m "not queue_transport")
          fi
          uv run --frozen pytest -q --tb=short --basetemp=.pytest_cache/task-processes \
            "${tests[@]}" "${selection[@]}"

      - name: 保存任务验收进程日志
        if: always() && (steps.tests.outputs.queue == 'true' || steps.tests.outputs.migration == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: task-processes-${{ github.run_id }}
          path: backend/.pytest_cache/task-processes
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      # ---------- 2. 前端检查与测试 ----------
      - name: 装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 前端 lint
        working-directory: frontend
        run: npm run lint

      - name: 前端测试
        if: steps.tests.outputs.frontend == 'true'
        working-directory: frontend
        env:
          TEST_ALL: ${{ steps.tests.outputs.frontend_full }}
          TEST_BASE: ${{ steps.tests.outputs.base }}
        run: |
          if [ "$TEST_ALL" = true ]; then
            npm run test:run
          else
            python3 - <<'PY'
          import os
          import subprocess

          changed = subprocess.check_output([
              "git", "diff", "--name-only", "--no-renames", "--relative", "-z",
              os.environ["TEST_BASE"], "HEAD", "--", ".",
          ]).decode().split("\0")
          # 源码扫描直接读文件，不能由 import 图追踪；每次前端改动都带上这项契约。
          sources = sorted({path for path in changed if path} | {"src/styles/shared-styles.node.spec.ts"})
          subprocess.run(["npm", "exec", "--", "vitest", "related", "--run", *sources], check=True)
          PY
          fi

      # ---------- 3. 前端构建 ----------
      # build 已包含 vue-tsc -b，类型检查失败时同样在发布前停止。
      # 不传任何 VITE_* 变量：VITE_API_BASE_URL 默认就是 /api（frontend/src/api/client.ts），
      # 而 VITE_* 会被编译进公开产物，不能放密钥。
      - name: 构建前端
        working-directory: frontend
        run: npm run build

      # ---------- 4. 构建并推送后端镜像 ----------
      - name: 登录 ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v7
        with:
          # 构建上下文是 backend/，不是仓库根：Dockerfile 里的 COPY 路径都相对它。
          context: backend
          push: true

          # 写死目标架构，不靠 runner 默认值。这一行是护栏：万一有人把上面的
          # runs-on 换回 x64，构建会因为要在 x64 上跑 arm64 而立刻报错（没装 QEMU），
          # 而不是安安静静推一个服务器跑不了的 amd64 镜像上去——后者的表现是
          # 部署全绿、容器无限重启，只有 docker logs 里那行 exec format error。
          platforms: linux/arm64
          # 这个值必须和服务器 .env 里的 BACKEND_IMAGE 完全一致，
          # 否则会出现「CI 推 A、服务器拉 B」——表现是部署全绿但代码没更新。
          tags: ${{ env.BACKEND_IMAGE }}

          # 这两个必须关掉，不是优化而是能不能推上去的问题。
          # buildx 从 v0.10 起默认给镜像附加 provenance / SBOM 证明，它们在 manifest 里用
          # application/vnd.oci.empty.v1+json 这个媒体类型占位。阿里云 ACR 个人版不认识它，
          # 会在最后一步拒收：`denied: unknown manifest class for
          # application/vnd.oci.empty.v1+json`。
          # 坑在于失败发生得很晚——所有层都已经推完，只有 manifest 被拒，日志里前面全是
          # 正常的 writing layer，容易误以为是网络或权限问题。
          provenance: false
          sbom: false

          # 缓存用 GitHub Actions 自带的，不用 registry：registry 缓存写的是
          # application/vnd.buildkit.cacheconfig.v0 媒体类型，ACR 个人版同样可能不认
          # （它已经拒了上面那个 OCI 类型）。type=gha 不依赖 registry 支持，
          # 免费、每仓库 10GB 按 LRU 淘汰，对这个镜像够用。
          # 作用是依赖没变时不用重装 langchain 全家桶，能省几分钟。
          # url 和 token 由 build-push-action 自动注入，不用自己传。
          cache-from: type=gha
          # ignore-error=true 是有意的：缓存只是省时间，不该有权让部署失败。
          # 默认值 false 会让缓存导出出错时整个构建失败，而它有两种现实的出错方式——
          # Actions 缓存 API 被限流时导出会卡到 `maximum timeout reached`，
          # 以及缓存服务 v1/v2 切换（buildkit 按 ACTIONS_CACHE_SERVICE_V2 决定用哪版）。
          # 这两种情况下镜像本身是好的，没有理由不部署。
          cache-to: type=gha,mode=max,ignore-error=true

      # 旧流程只在目录里执行 Docker；候选编排还要求部署账号能创建和替换文件。
      - name: 准备编排目录写入权限
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"
            test -f docker-compose.yml
            test -f .env
            if [ ! -w . ]; then
              # 复用现有镜像，只调整项目目录本身；不递归触碰 .env、数据或其他项目。
              deploy_path="$(pwd -P)"
              deploy_image="$(docker compose images -q backend | sort -u)"
              test -n "$deploy_image"
              docker run --rm --network none --read-only --user 0 --entrypoint python \
                --mount "type=bind,src=$deploy_path,dst=/deployment" "$deploy_image" \
                -c 'import os, sys; os.chown("/deployment", int(sys.argv[1]), int(sys.argv[2]))' \
                "$(id -u)" "$(id -g)"
            fi
            test -w .
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}

      # 编排先以候选文件上传，旧文件仍可用来停止旧 scheduler。
      - name: 上传候选后端编排
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -rlgoDz
          path: backend/docker-compose.yml
          remote_path: ${{ vars.DEPLOY_DIR }}/docker-compose.next.yml
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      # ---------- 5. 部署后端 ----------
      # 在传前端之前做，是有意的：迁移失败就中止在这里，前端仍是旧版本，
      # 不会出现「新前端调老后端」。反过来先传前端则做不到这一点。
      - name: 部署后端
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # 密码通过 envs 传成远端的环境变量，不写进 script 的命令行——命令行会进
          # 服务器的进程列表和 shell history。
          envs: ACR_PASSWORD,ACR_REGISTRY,ACR_USERNAME,DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"

            # --password-stdin 而不是 -p：后者会让密码出现在进程列表里。
            echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin

            # 这一步不能省。tag 恒为 backend-latest，up -d 认为 tag 没变就会直接复用
            # 本地旧镜像——表现是本工作流全绿、容器也重启了，但跑的还是上一版代码。
            docker compose -f docker-compose.next.yml config --quiet
            docker compose -f docker-compose.next.yml pull

            # 仅验证候选网络上的已有 Redis；配置错误时保留当前应用继续运行。
            # 连接凭据由客户端直接使用，错误只报告类型，不输出 URL、密码或配置。
            docker compose -f docker-compose.next.yml run --no-deps --rm -T backend python - <<'PY'
            import sys
            from redis import Redis
            from agent_lab.config.redis import get_redis_settings

            try:
                settings = get_redis_settings()
                with Redis.from_url(settings.url.get_secret_value(),
                                    password=settings.password.get_secret_value() or None,
                                    socket_connect_timeout=5, socket_timeout=5) as client:
                    client.ping()
            except Exception as error:
                print(f"已有 Redis 连接检查失败（{type(error).__name__}）；请核对地址、密码和网络。", file=sys.stderr)
                raise SystemExit(1)
            print("已有 Redis 连接检查通过")
            PY

            # 共享任务表升级前停止旧写入口。外部 CLI 和未决远端写入仍须按部署文档先核实。
            # 迁移失败保持停止，不自动重启已不兼容的旧进程；旧镜像/编排保留作诊断依据。
            legacy_scheduler=false
            if [ -f docker-compose.yml ]; then
              services="$(docker compose config --services)"
              for service in scheduler task-beat backend task-worker; do
                if printf '%s\n' "$services" | grep -Fxq "$service"; then
                  [ "$service" != scheduler ] || legacy_scheduler=true
                  docker compose stop --timeout 360 "$service"
                fi
              done
              cp docker-compose.yml docker-compose.previous.yml
            fi
            docker compose -f docker-compose.next.yml run --no-deps --rm backend alembic upgrade head
            docker compose -f docker-compose.next.yml run --no-deps --rm backend agent-lab init-checkpointer
            # 遗留待办只在旧 scheduler 布局首次切换时受理。普通部署不能重建已取消/失败批次。
            if [ "$legacy_scheduler" = true ]; then
              docker compose -f docker-compose.next.yml run --no-deps --rm backend python -m agent_lab.tasks.bootstrap
            fi
            mv docker-compose.next.yml docker-compose.yml
            docker compose up -d backend task-worker task-beat

            # 验证进程真的起来了并且连得上 PostgreSQL。没有这一步，容器崩溃重启循环时
            # 本工作流仍会显示成功。python:3.12-slim 里没有 curl，所以用 Python 自己发请求。
            for i in $(seq 1 10); do
              if docker compose exec -T backend python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"; then
                echo "健康检查通过"
                break
              fi
              if [ "$i" -eq 10 ]; then
                echo "健康检查连续失败，输出最后 50 行日志："
                docker compose logs --tail 50 backend
                exit 1
              fi
              sleep 3
            done

            # Beat 检查只读本容器状态；Worker 检查精确指向本容器主进程，不执行业务。
            for i in $(seq 1 10); do
              if docker compose exec -T task-beat python -m agent_lab.tasks.status --check && \
                 docker compose exec -T task-worker sh -c 'celery -A agent_lab.tasks.celery_app:app inspect ping --destination "worker@$HOSTNAME" --timeout 5'; then
                echo "Beat 推进与 Worker 消息连接检查通过"
                break
              fi
              if [ "$i" -eq 10 ]; then
                echo "任务进程就绪检查失败，请检查调度、消息连接及待核实执行"
                docker compose logs --tail 50 task-beat task-worker
                exit 1
              fi
              sleep 3
            done

            # 新进程就绪后只清理本项目遗留的两个服务，不使用会扫到其他服务的 --remove-orphans。
            # scheduler 必须已经退出；Redis 正常关停后删容器，保留数据卷供核查与回退。
            compose_project="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' agent-lab-backend)"
            test -n "$compose_project"
            for legacy_service in scheduler redis; do
              legacy_containers="$(docker ps -aq \
                --filter "label=com.docker.compose.project=$compose_project" \
                --filter "label=com.docker.compose.service=$legacy_service")"
              for container in $legacy_containers; do
                if [ "$legacy_service" = scheduler ]; then
                  if [ "$(docker inspect --format '{{.State.Running}}' "$container")" = true ]; then
                    echo "旧 scheduler 仍在运行，需核实旧写入后再清理；未强制删除。"
                    exit 1
                  fi
                else
                  docker stop --timeout 30 "$container"
                fi
                docker rm "$container"
              done
            done

            # 被 backend-latest 覆盖掉的旧镜像会变成无名镜像留在磁盘上，不清理会慢慢吃满。
            docker image prune -f
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}

      # ---------- 6. 上传前端 dist ----------
      # 用 rsync --delete 而不是 scp：Vite 产物文件名带哈希（app-abc123.js），
      # 每次构建都变，只拷不删会让目录里堆满历史废文件。
      # 尾部斜杠有意义：source 带斜杠表示「拷目录内容」而不是「拷目录本身」，
      # 去掉会变成 index/dist/ 这样嵌一层。
      - name: 上传前端 dist
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -rlgoDz --delete
          path: frontend/dist/
          # 尾部斜杠是必需的，见上面注释。WEB_ROOT 里不要带尾部斜杠，这里统一补一个，
          # 避免 Variables 里填了斜杠时变成两个（rsync 对 // 宽容，但目录名会显得可疑）。
          remote_path: ${{ vars.WEB_ROOT }}/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
