[project]
name = "agent-lab"
version = "0.1.0"
description = "Agent Lab backend: FreshRSS ingestion, Qdrant indexing, and vector search"
readme = "README.md"
authors = [
    { name = "zhengkanghua", email = "2040803007@qq.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "apscheduler>=3.11,<4",
    "boto3>=1.35,<2",
    "beautifulsoup4>=4.15.0",
    "docling-core[chunking]==2.95.0",
    "docling-slim[format-html,format-markdown]==2.126.0",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15,<16",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-core>=1.5.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.1",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.26",
    "qdrant-client>=1.19.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
    "celery[redis]>=5.6,<6",
]

[project.scripts]
agent-lab = "agent_lab.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "queue_transport: 真实 Redis 重启与自然超时重投；消息组件、依赖或队列配置变化时执行",
]
