[project]
name = "news-vector-service"
version = "0.1.0"
description = "FreshRSS news ingestion, Qdrant indexing, and vector search service"
readme = "README.md"
authors = [
    { name = "zhengkanghua", email = "2040803007@qq.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15,<16",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-core>=1.5.4",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.0",
    "sqlalchemy>=2.0.51",
    "tiktoken>=0.13.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
news-vector-service = "news_vector_service.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
