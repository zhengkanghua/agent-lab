# 同一后端镜像运行 API、单个 Beat 和 Linux prefork Worker。
# PostgreSQL 保存受理与结果，Redis 使用环境已有实例；前端由 OpenResty 发布静态文件。
#
# ⚠ **这份文件已经不再是日常部署用的那一份。** 后端改成 Swarm 服务之后，CI 用同目录的
# ``docker-stack.yml``（`docker stack deploy`）部署；普通容器形态下「停旧 → 迁移 → 起新」
# 那套流程与它一起退成**退回旧部署方式的逃生路径**，只在演练或改造出问题时用（命令与
# 前置条件见 docs/container_deployment.md）。留着它是因为那条路必须真的走过、而不是写在纸上。
#
# 回到旧方式时用普通 compose（`docker compose up -d`），不要用 `docker stack deploy` 读这份：
# 它带着栈加载器不认或会静默忽略的写法（container_name、restart:、相对路径挂载）。
x-backend: &backend
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE 未设置：检查本文件同目录的 .env}
  restart: unless-stopped
  stop_grace_period: 360s
  env_file:
    - .env
  environment: &backend-environment
    TZ: ${TZ:-Asia/Shanghai}
    # 容器必须显式连接已有 Redis，避免误用本地地址或另建一套实例。
    REDIS_URL: ${REDIS_URL:?REDIS_URL 未设置：请在 .env 配置已有 Redis 的容器可达地址}
  networks:
    - 1panel-network
  volumes:
    - ./data:/data
    - ./.env:/app/.env:ro
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  1panel-network:
    external: true

services:
  backend:
    <<: *backend
    container_name: agent-lab-backend
    # API 的停止宽限单独取 180 秒 = uvicorn 关停超时 30 秒（entrypoint.sh）＋ 排空上限
    # 120 秒（agent/limits.RUN_DRAIN_TIMEOUT_SECONDS）＋ 收尾写入的余量。它不再跟着
    # 「一次运行最坏能跑多久」走，也不再与另外两个服务共用上面那个 360 秒——Beat 与 Worker
    # 的活要按各自的需要收尾，见 docs/adr/0039 与 0040。
    stop_grace_period: 180s
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18000}:8000"
    environment:
      <<: *backend-environment
      WORKER_COUNT: ${WORKER_COUNT:-2}
    # 不依赖 Redis 就绪：消息代理暂不可用时，API 仍可持久受理和查询。

  task-beat:
    <<: *backend
    container_name: agent-lab-task-beat
    command: ["celery", "-A", "agent_lab.tasks.celery_app:app", "beat", "--loglevel=INFO", "--pidfile="]
    healthcheck:
      # 只读本进程的调度推进状态，不触发业务。
      test: ["CMD", "python", "-m", "agent_lab.tasks.status", "--check"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  task-worker:
    <<: *backend
    # 不固定 container_name，允许 --scale task-worker=N；Beat 始终只有一个实例。
    command:
      - celery
      - -A
      - agent_lab.tasks.celery_app:app
      - worker
      - --loglevel=INFO
      - --pool=prefork
      - --concurrency=${TASK_WORKER_CONCURRENCY:-2}
      - --hostname=worker@%h
    healthcheck:
      # 精确指向当前容器的主进程；业务领取/结果仍通过任务详情判断。
      test: ["CMD-SHELL", "celery -A agent_lab.tasks.celery_app:app inspect ping --destination worker@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
