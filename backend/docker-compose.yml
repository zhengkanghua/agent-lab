# 同一后端镜像运行 API、单个 Beat 和 Linux prefork Worker。
# PostgreSQL 保存受理与结果，Redis 是项目共用中间件；前端由 OpenResty 发布静态文件。
# 首次切换须先停止旧 scheduler/API/CLI 并核实旧写入，再迁移，见 docs/container_deployment.md。
x-backend: &backend
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE 未设置：检查本文件同目录的 .env}
  restart: unless-stopped
  stop_grace_period: 360s
  env_file:
    - .env
  environment: &backend-environment
    TZ: ${TZ:-Asia/Shanghai}
    # 本地 Python 开发默认连 localhost；容器默认使用内部网络中的共用 Redis。
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  networks:
    - 1panel-network
    - middleware
  volumes:
    - ./data:/data
    - ./.env:/app/.env:ro
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  1panel-network:
    external: true
  middleware:
    internal: true

volumes:
  redis-data:

services:
  backend:
    <<: *backend
    container_name: agent-lab-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18000}:8000"
    environment:
      <<: *backend-environment
      WORKER_COUNT: ${WORKER_COUNT:-2}
    # 不依赖 Redis 就绪：消息代理暂不可用时，API 仍可持久受理和查询。

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
    # 共用中间件不暴露宿主端口，也不接入共享 1panel 网络。
    networks:
      - middleware
    volumes:
      - redis-data:/data
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  task-beat:
    <<: *backend
    container_name: agent-lab-task-beat
    command: ["celery", "-A", "agent_lab.tasks.celery_app:app", "beat", "--loglevel=INFO", "--pidfile="]
    healthcheck:
      # 只读本进程的调度推进状态，不触发业务。
      test: ["CMD", "python", "-m", "agent_lab.tasks.status", "--check"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  task-worker:
    <<: *backend
    # 不固定 container_name，允许 --scale task-worker=N；Beat 始终只有一个实例。
    command:
      - celery
      - -A
      - agent_lab.tasks.celery_app:app
      - worker
      - --loglevel=INFO
      - --pool=prefork
      - --concurrency=${TASK_WORKER_CONCURRENCY:-2}
      - --hostname=worker@%h
    healthcheck:
      # 精确指向当前容器的主进程；业务领取/结果仍通过任务详情判断。
      test: ["CMD-SHELL", "celery -A agent_lab.tasks.celery_app:app inspect ping --destination worker@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
